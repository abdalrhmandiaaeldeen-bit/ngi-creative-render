<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Investment</title>
<!-- Fields: kicker, highlight, typeLabel, areaText, city, priceText -->
<style>
  .card { background: #0b0b0b; }
  .tag { position: absolute; left: 70px; top: 62px; z-index: 4; padding: 14px 26px; border-radius: 999px;
    background: rgba(23,63,69,0.72); border: 1.5px solid rgba(181,138,74,0.8); }
  .glass { position: absolute; left: 50px; right: 50px; bottom: 140px; z-index: 4; padding: 44px 50px 46px; border-radius: 30px;
    background: rgba(23,63,69,0.78); border: 1px solid rgba(231,210,174,0.25); box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
  .headline { font-size: 52px; font-weight: 700; line-height: 1.12; }
  .chips { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .chip { font-size: 25px; font-weight: 600; padding: 10px 22px; border-radius: 999px; background: rgba(231,210,174,0.14); color: var(--gold-light); }
  .chip:empty { display: none; }
  .price { margin-top: 28px; font-size: 24px; font-weight: 600; letter-spacing: 3px; color: #D6DCE5; }
  .price b { font-family: var(--display-font); font-weight: 800; font-size: 62px; letter-spacing: 0; color: #fff; margin-left: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="stage" style="left:0; top:0; width:1080px; height:1350px;">
    <img class="bg" src="{{photoDataUri}}">
    <img class="fg" src="{{photoDataUri}}" style="height: 760px; top: 150px;">
  </div>
  <div class="tag kicker">{{kicker}}</div>
  <div class="glass">
    <div class="headline serif">{{highlight}}</div>
    <div class="chips"><div class="chip">{{typeLabel}}</div><div class="chip">{{areaText}}</div><div class="chip">{{city}}</div></div>
    <div class="price">FROM<b>{{priceText}}</b></div>
  </div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
