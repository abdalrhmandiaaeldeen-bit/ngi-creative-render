<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Two photos</title>
<!-- Fields (empty ones disappear): kicker ("MAKADI BAY · RED SEA"), titleText ("Grand Villa in Siyal"),
     byText ("by Orascom Development · Makadi Bay"), priceLabel ("DOWN PAYMENT FROM"), priceText ("EGP 2,925,000"),
     planLabel ("INSTALLMENTS"), planText ("Up to 4 years"), detailText ("4 Bedrooms · 192 m²"), website, phone.
     Owner 1 Nov 2026: photo-led designs like the first posts; never the full price (31 Oct rule). Takes photoBase64 (outside view) and photo2Base64 (inside view); both anchored top-left. -->
<style>
  * { box-sizing: border-box; } body { margin: 0; }
  .card { position: relative; overflow: hidden; font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif; }
  .pf { font-family: 'Playfair Display', Georgia, serif; }
  .e:empty { display: none; }
  .ft { position: absolute; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .ft .it { display: flex; align-items: center; gap: 12px; }
  .ft svg { width: 26px; height: 26px; }
  .card { width: 1080px; height: 1350px; background: #173F45; color: #fff; }
  .p1 { position: absolute; left: 0; top: 0; width: 1080px; height: 580px; object-fit: cover; object-position: 0% 0%; }
  .p2 { position: absolute; left: 0; top: 770px; width: 1080px; height: 580px; object-fit: cover; object-position: 0% 0%; }
  .bd { position: absolute; left: 0; right: 0; top: 580px; height: 190px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
  .ti { font-size: 44px; line-height: 1.1; }
  .by { font-size: 22px; opacity: .85; margin-top: 8px; }
  .rt { text-align: right; }
  .lb { font-size: 19px; font-weight: 700; letter-spacing: 3.6px; color: #D9B36C; }
  .pr { font-size: 46px; font-weight: 700; margin-top: 4px; }
  .fb { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: rgba(23,63,69,.88); }
  .ft { left: 60px; right: 60px; bottom: 24px; font-size: 22px; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <img class="p1" src="{{photoDataUri}}">
  <img class="p2" src="{{photo2DataUri}}">
  <div class="bd">
    <div><div class="ti pf e">{{titleText}}</div><div class="by e">{{byText}}</div></div>
    <div class="rt"><div class="lb e">{{priceLabel}}</div><div class="pr pf e">{{priceText}}</div></div>
  </div>
  <div class="fb"></div>
  <div class="ft"><div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg><span>{{website}}</span></div><div class="it"><span>{{phone}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
</body>
</html>
