<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Offer</title>
<!-- Fields: offerBig ("20%"), offerText ("discount on cash payment"), kicker, specsText, priceText -->
<style>
  .panel { position: absolute; left: 0; top: 760px; width: 1080px; height: 590px; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%); }
  .badge { position: absolute; right: 70px; top: 600px; width: 300px; height: 300px; border-radius: 50%; z-index: 5;
    background: radial-gradient(circle at 30% 25%, #E9CD8F 0%, var(--gold) 55%, #A9833E 100%);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--navy); }
  .badge .big { font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .badge .unit { font-size: 30px; font-weight: 700; letter-spacing: 6px; margin-top: 6px; }
  .copy { position: absolute; left: 70px; top: 820px; width: 600px; }
  .headline { font-size: 60px; font-weight: 700; line-height: 1.1; margin-top: 18px; text-transform: capitalize; }
  .specs { font-size: 28px; font-weight: 500; color: #D6DCE5; margin-top: 26px; }
  .price { position: absolute; left: 70px; top: 1130px; font-size: 26px; font-weight: 600; letter-spacing: 3px; color: var(--gold-light); }
  .price b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 58px; letter-spacing: 0; color: #fff; margin-top: 6px; }
  .rule { position: absolute; left: 70px; right: 70px; bottom: 118px; height: 1px; background: rgba(245,225,184,0.35); }
</style>
</head>
<body>
<div class="card">
  <div class="stage" style="left:0; top:0; width:1080px; height:760px;">
    <img class="bg" src="{{photoDataUri}}"><img class="fg" src="{{photoDataUri}}">
  </div>
  <div class="panel"></div>
  <div class="badge"><div class="big">{{offerBig}}</div><div class="unit">{{offerUnit}}</div></div>
  <div class="copy">
    <div class="kicker">{{kicker}}</div>
    <div class="headline serif">{{offerText}}</div>
    <div class="specs empty-hide">{{specsText}}</div>
  </div>
  <div class="price">STARTING FROM <b>{{priceText}}</b></div>
  <div class="rule"></div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
