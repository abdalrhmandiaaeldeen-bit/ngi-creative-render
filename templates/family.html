<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Family home</title>
<!-- Fields: kicker, headline, bedsText ("3 Bedrooms"), areaText, city, priceText -->
<style>
  .card { background: var(--cream); color: var(--navy); }
  .top { position: absolute; left: 70px; right: 70px; top: 64px; }
  .headline { font-size: 62px; font-weight: 700; line-height: 1.08; margin-top: 14px; }
  .stage { left: 40px; top: 300px; width: 1000px; height: 620px; border-radius: 30px; box-shadow: 0 22px 55px rgba(23,63,69,0.25); }
  .facts { position: absolute; left: 70px; right: 70px; top: 960px; display: flex; justify-content: space-between; }
  .fact { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; }
  .fact:has(span:empty) { display: none; }
  .fact svg { width: 44px; height: 44px; stroke: var(--gold); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: var(--navy); }
  .price { position: absolute; left: 70px; bottom: 120px; color: #fff; font-size: 24px; font-weight: 600; letter-spacing: 3px; }
  .price b { font-family: var(--display-font); font-weight: 800; font-size: 56px; letter-spacing: 0; margin-left: 12px; color: var(--gold-light); }
  .footer { color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="kicker">{{kicker}}</div>
    <div class="headline serif">{{headline}}</div>
  </div>
  <div class="stage"><img class="bg" src="{{photoDataUri}}"><img class="fg" src="{{photoDataUri}}"></div>
  <div class="facts">
    <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 18V8m0 6h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg><span>{{bedsText}}</span></div>
    <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h6V3M21 15h-6v6"/></svg><span>{{areaText}}</span></div>
    <div class="fact"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>{{city}}</span></div>
  </div>
  <div class="bar"></div>
  <div class="price">FROM<b>{{priceText}}</b></div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
