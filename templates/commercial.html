<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Commercial</title>
<!-- Fields: kicker, headline, highlight, specsText, priceText -->
<style>
  .card { background: var(--navy-2); }
  .stage { left: 0; top: 0; width: 1080px; height: 740px; }
  .goldline { position: absolute; left: 0; top: 740px; width: 1080px; height: 6px; background: linear-gradient(90deg, #8F6A35, #D9B784, #8F6A35); }
  .copy { position: absolute; left: 70px; right: 70px; top: 800px; }
  .headline { font-size: 60px; font-weight: 700; line-height: 1.1; margin-top: 16px; }
  .sub { font-size: 30px; font-weight: 500; color: #C9CED6; margin-top: 18px; }
  .specs { display: inline-block; margin-top: 26px; font-size: 26px; font-weight: 600; letter-spacing: 1px; padding: 12px 24px; border: 1.5px solid rgba(181,138,74,0.7); border-radius: 12px; color: var(--gold-light); }
  .specs:empty { display: none; }
  .price { position: absolute; right: 70px; top: 1110px; text-align: right; font-size: 24px; font-weight: 600; letter-spacing: 3px; color: #C9CED6; }
  .price b { display: block; font-family: var(--display-font); font-weight: 800; font-size: 60px; letter-spacing: 0; color: var(--gold); margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="stage"><img class="bg" src="{{photoDataUri}}"><img class="fg" src="{{photoDataUri}}"></div>
  <div class="goldline"></div>
  <div class="copy">
    <div class="kicker">{{kicker}}</div>
    <div class="headline serif">{{headline}}</div>
    <div class="sub empty-hide">{{highlight}}</div>
    <div class="specs">{{specsText}}</div>
  </div>
  <div class="price">STARTING FROM<b>{{priceText}}</b></div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
