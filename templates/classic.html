<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Classic</title>
<!-- Fields (empty ones disappear): kicker ("MAKADI BAY · RED SEA"), titleText ("Grand Villa in Siyal"),
     byText ("by Orascom Development · Makadi Bay"), priceLabel ("DOWN PAYMENT FROM"), priceText ("EGP 2,925,000"),
     planLabel ("INSTALLMENTS"), planText ("Up to 4 years"), detailText ("4 Bedrooms · 192 m²"), website, phone.
     Owner 1 Nov 2026: photo-led designs like the first posts; never the full price (31 Oct rule). Photo is cropped to fill (landscape photos lose their printed logo, so the template prints the NGI wordmark). -->
<style>
  * { box-sizing: border-box; } body { margin: 0; }
  .card { position: relative; overflow: hidden; font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif; }
  .pf { font-family: 'Playfair Display', Georgia, serif; }
  .e:empty { display: none; }
  .ft { position: absolute; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .ft .it { display: flex; align-items: center; gap: 12px; }
  .ft svg { width: 26px; height: 26px; }
  .card { width: 1080px; height: 1350px; background: #111; color: #fff; }
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%; }
  .sh { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.85) 100%); }
  .wm { position: absolute; left: 70px; top: 56px; }
  .wm b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 46px; letter-spacing: 4px; color: #D9B36C; }
  .wm i { font-style: normal; font-size: 17px; font-weight: 600; letter-spacing: 3.2px; }
  .tx { position: absolute; left: 70px; right: 70px; bottom: 140px; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .ti { font-size: 56px; line-height: 1.12; }
  .by { font-size: 25px; opacity: .92; margin-top: 12px; }
  .lb { font-size: 24px; font-weight: 700; letter-spacing: 4.4px; color: #D9B36C; margin-top: 36px; }
  .pr { font-size: 82px; font-weight: 700; line-height: 1.08; }
  .dt { font-size: 26px; margin-top: 14px; }
  .ft { left: 70px; right: 70px; bottom: 50px; font-size: 25px; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <img class="ph" src="{{photoDataUri}}">
  <div class="sh"></div>
  <div class="wm"><b>NGI</b><i>NEW GENERATION INVESTMENT</i></div>
  <div class="tx">
    <div class="ti pf e">{{titleText}}</div>
    <div class="by e">{{byText}}</div>
    <div class="lb e">{{priceLabel}}</div>
    <div class="pr pf e">{{priceText}}</div>
    <div class="dt e">{{detailText}}</div>
  </div>
  <div class="ft"><div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg><span>{{website}}</span></div><div class="it"><span>{{phone}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
</body>
</html>
