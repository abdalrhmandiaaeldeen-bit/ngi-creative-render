<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Headline</title>
<!-- Owner 8 Nov 2026: full-bleed photo with the text on it (no cream / empty panels). Headline: big title at the top; down payment / installments / size on a gold rule at the bottom.
     Fields (empty ones disappear): kicker, titleText, byText, priceLabel, priceText, planLabel, planText, detailText, website, phone.
     Never the full price (31 Oct): priceLabel "DOWN PAYMENT FROM" + priceText, or "FLEXIBLE PAYMENT PLANS" alone.
     The photo is cropped to fill (centre); that removes the logo printed on landscape photos, so the template prints the
     NGI logo itself ({{logoDataUri}}, filled by server.js from assets/ngi-logo-shadow.png). -->
<style>
  * { box-sizing: border-box; } body { margin: 0; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0f2a2e; color: #fff; font-family: 'Montserrat', sans-serif; }
  .pf { font-family: 'Playfair Display', Georgia, serif; } .e:empty { display: none; }
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
  .logo { position: absolute; width: 230px; }
  .ft { position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 500; color: #fff; }
  .ft .it { display: flex; align-items: center; gap: 12px; } .ft svg { width: 26px; height: 26px; }
  .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,24,27,.88) 0%,rgba(8,24,27,.5) 26%,rgba(8,24,27,0) 44%,rgba(8,24,27,0) 56%,rgba(8,24,27,.78) 78%,rgba(8,24,27,.95) 100%)}
  .logo{right:52px;top:40px;width:200px}.top{position:absolute;left:64px;right:300px;top:70px}
  .kc{font-size:22px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#D9B36C}.ti{font-size:76px;line-height:1.04;margin-top:16px}.by{font-size:25px;opacity:.9;margin-top:16px}
  .strip{position:absolute;left:64px;right:64px;bottom:118px;display:flex;align-items:stretch;border-top:2px solid rgba(217,179,108,.85);padding-top:26px}
  .cell{flex:0 1 auto}.cell+.cell{border-left:1px solid rgba(255,255,255,.35);padding-left:40px;margin-left:40px}.cell:empty{display:none}
  .lb{white-space:nowrap;font-size:19px;font-weight:700;letter-spacing:4px;color:#D9B36C}.pr{font-size:54px;font-weight:700;line-height:1.1;margin-top:6px}.pl{font-size:34px;font-weight:600;margin-top:10px}.dt{font-size:30px;font-weight:600;margin-top:0;white-space:nowrap}
</style>
</head>
<body>
<div class="card">
  <img class="ph" src="{{photoDataUri}}">
  <div class="sh"></div>
  <img class="logo" src="{{logoDataUri}}">
  <div class="top"><div class="kc e">{{kicker}}</div><div class="ti pf e">{{titleText}}</div><div class="by e">{{byText}}</div></div>
  <div class="strip"><div class="cell"><div class="lb e">{{priceLabel}}</div><div class="pr pf e">{{priceText}}</div></div><div class="cell"><div class="lb e">{{planLabel}}</div><div class="pl e">{{planText}}</div></div><div class="cell"><div class="dt e">{{detailText}}</div></div></div>
  <div class="ft"><div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg><span>{{website}}</span></div><div class="it"><span>{{phone}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
</body>
</html>
