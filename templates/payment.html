<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Payment plan</title>
<!-- Fields: kicker, headline, dpPercent ("10%"), yearsText ("4"), priceShort ("EGP 1,350,000"), priceShortLabel ("Down payment from"), specsText -->
<style>
  .card { background: var(--cream); color: var(--navy); }
  .top { position: absolute; left: 70px; top: 64px; right: 70px; }
  .headline { font-size: 64px; font-weight: 700; line-height: 1.08; margin-top: 14px; }
  .stage { left: 70px; top: 300px; width: 940px; height: 560px; border-radius: 28px; box-shadow: 0 20px 50px rgba(23,63,69,0.25); }
  .stats { position: absolute; left: 70px; right: 70px; top: 905px; display: flex; gap: 22px; }
  .stat { flex: 1; background: var(--navy); color: #fff; border-radius: 22px; padding: 30px 26px 28px; text-align: center; }
  .stat .v { font-family: var(--display-font); font-weight: 800; font-size: 66px; font-weight: 700; color: var(--gold-light); line-height: 1; white-space: nowrap; }
  .stat .v small { font-size: 32px; }
  .stat .l { font-size: 21px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-top: 14px; color: #D6DCE5; }
  .stat.price .v { font-size: 50px; padding-top: 10px; }
  .specs { position: absolute; left: 70px; right: 70px; top: 1150px; text-align: center; font-size: 28px; font-weight: 600; color: var(--navy-2); }
  .footer { color: var(--navy); }
  .footer svg { stroke: var(--navy); }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="kicker">{{kicker}}</div>
    <div class="headline serif">{{headline}}</div>
  </div>
  <div class="stage"><img class="bg" src="{{photoDataUri}}"><img class="fg" src="{{photoDataUri}}"></div>
  <div class="stats">
    <div class="stat"><div class="v">{{dpPercent}}</div><div class="l">Down payment</div></div>
    <div class="stat"><div class="v">{{yearsText}}<small> yrs</small></div><div class="l">Installments</div></div>
    <div class="stat price"><div class="v">{{priceShort}}</div><div class="l">{{priceShortLabel}}</div></div>
  </div>
  <div class="specs empty-hide">{{specsText}}</div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
