<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Signature Card</title>
<style>
{{brandCss}}
.canvas { background: var(--ink); }
.canvas .photo { left: 0; top: 0; width: 1080px; height: 1350px; }
.scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 260px; background: linear-gradient(180deg, rgba(10,12,16,0.45), rgba(10,12,16,0)); }
.loc { position: absolute; left: 56px; top: 60px; display: flex; align-items: center; gap: 14px; color: var(--ivory); font-size: 17px; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }
.loc::before { content: ''; width: 46px; height: 2px; background: var(--gold-1); }
.badge { position: absolute; right: 56px; top: 46px; border: 1.5px solid var(--gold-1); color: var(--ivory); background: rgba(20,24,30,0.55); padding: 13px 24px; font-size: 15px; }
.card { position: absolute; left: 56px; right: 56px; bottom: 56px; background: var(--ivory); padding: 50px 56px 0; }
.card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--gold-grad); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 30px; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: 66px; line-height: 1; color: var(--ink); }
.head .sub { margin-top: 12px; font-size: 17px; color: var(--muted-dark); }
.head img { height: 86px; flex: none; margin-top: -6px; }
.mid { margin-top: 34px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 34px; border-bottom: 1px solid #DDD3C4; }
.price .eyebrow { font-size: 15px; color: var(--gold-3); }
.price .amt { margin-top: 8px; font-family: var(--serif); font-weight: 700; font-size: 74px; line-height: 0.95; color: var(--ink); white-space: nowrap; }
.plan { display: flex; gap: 30px; }
.plan .n { font-family: var(--serif); font-weight: 700; font-size: 54px; line-height: 1; color: var(--gold-3); text-align: center; }
.plan .l { margin-top: 6px; font-size: 12px; color: var(--muted-dark); text-align: center; }
.specs { display: flex; gap: 0; padding: 26px 0; font-size: 20px; font-weight: 600; color: var(--ink); }
.specs > div { display: flex; align-items: center; gap: 10px; margin-right: 34px; }
.specs svg { width: 24px; height: 24px; stroke: var(--gold-3); fill: none; stroke-width: 1.6; }
.foot { margin: 0 -56px; background: var(--ink); color: var(--ivory); display: flex; justify-content: space-between; align-items: center; padding: 24px 56px; font-size: 21px; font-weight: 500; letter-spacing: 0.03em; }
.foot span { color: var(--gold-1); }
</style>
</head>
<body>
<div class="canvas">
  <img class="photo" src="{{photoDataUri}}">
  <div class="scrim"></div>
  <div class="loc eyebrow" data-opt><span class="v">{{location}}</span></div>
  <div class="badge eyebrow" data-opt><span class="v">{{badge}}</span></div>

  <div class="card">
    <div class="head">
      <div>
        <h1>{{projectName}}</h1>
        <div class="sub eyebrow" data-opt><span class="v">{{subtitle}}</span></div>
      </div>
      <img src="{{logoGold}}" alt="NGI">
    </div>
    <div class="mid">
      <div class="price">
        <div class="eyebrow">{{priceLabel}}</div>
        <div class="amt">{{priceText}}</div>
      </div>
      <div class="plan">
        <div data-opt><div class="n v">{{downPayment}}</div><div class="l eyebrow">{{downPaymentLabel}}</div></div>
        <div data-opt><div class="n v">{{installmentYears}}</div><div class="l eyebrow">Installments</div></div>
      </div>
    </div>
    <div class="specs">
      <div data-opt><svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg><span class="v">{{areaText}}</span></div>
      <div data-opt><svg viewBox="0 0 24 24"><path d="M3 18V8M21 18v-5H3M7 13V10h5v3"/></svg><span class="v">{{bedsText}}</span></div>
      <div data-opt><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V10l6-5 6 5v10M10 20v-5h4v5"/></svg><span class="v">{{extraText}}</span></div>
    </div>
    <div class="foot"><div>{{website}}</div><div><span>{{phone}}</span></div></div>
  </div>
</div>
</body>
</html>
