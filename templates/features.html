<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGI — Features</title>
<!-- Fields: kicker, headline, feat1..feat5, priceLabel ("DOWN PAYMENT FROM"), priceText -->
<style>
  .card { background: var(--navy); }
  .stage { left: 0; top: 0; width: 1080px; height: 640px; }
  .copy { position: absolute; left: 70px; right: 70px; top: 690px; }
  .headline { font-size: 54px; font-weight: 700; line-height: 1.1; margin-top: 12px; }
  .list { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; row-gap: 18px; }
  .feat { position: relative; padding-left: 50px; font-size: 27px; font-weight: 500; line-height: 1.25; color: #E6EAF0; }
  .feat::before { content: ''; position: absolute; left: 0; top: 2px; width: 32px; height: 32px; border-radius: 50%; background: var(--gold); }
  .feat::after { content: ''; position: absolute; left: 10px; top: 9px; width: 9px; height: 15px; border: solid var(--navy); border-width: 0 3.5px 3.5px 0; transform: rotate(45deg); }
  .feat:empty { display: none; }
  .price { position: absolute; left: 70px; bottom: 118px; font-size: 24px; font-weight: 600; letter-spacing: 3px; color: var(--gold-light); }
  .price b { font-family: var(--display-font); font-weight: 800; font-size: 50px; letter-spacing: 0; color: #fff; margin-left: 12px; }
  .rule { position: absolute; left: 70px; right: 70px; bottom: 210px; height: 1px; background: rgba(231,210,174,0.3); }
</style>
</head>
<body>
<div class="card">
  <div class="stage"><img class="bg" src="{{photoDataUri}}"><img class="fg" src="{{photoDataUri}}"></div>
  <div class="copy">
    <div class="kicker">{{kicker}}</div>
    <div class="headline serif">{{headline}}</div>
    <div class="list">
      <div class="feat">{{feat1}}</div><div class="feat">{{feat2}}</div><div class="feat">{{feat3}}</div>
      <div class="feat">{{feat4}}</div><div class="feat">{{feat5}}</div><div class="feat">{{feat6}}</div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="price">{{priceLabel}}<b>{{priceText}}</b></div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3Z"/></svg>{{website}}</div>
    <div class="item">{{phone}}<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6.6 10.8c1.5 3 4.1 5.6 7.1 7.1l2.4-2.4c.3-.3.7-.4 1.1-.3 1.3.4 2.7.6 4.1.6.7 0 1.2.6 1.2 1.3v3.6c0 .7-.6 1.3-1.3 1.3C10.8 22 2 13.2 2 2.3 2 1.6 2.6 1 3.3 1h3.6c.7 0 1.3.5 1.3 1.2 0 1.4.2 2.8.6 4.1.1.4 0 .8-.3 1.1L6.6 10.8Z" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</body>
</html>
